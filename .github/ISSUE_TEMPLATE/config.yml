# Security reports must not arrive as public issues -- SECURITY.md asks for
# private disclosure, and a template that offers "Bug report" as the only route
# invites exactly the thing that policy is trying to prevent. blank_issues is
# left enabled so anything that fits neither template still has a home.
blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/reprodev/cvedeck/security/advisories/new
    about: >-
      Please do NOT open a public issue for a security problem. This opens a
      private advisory visible only to you and the maintainers. See SECURITY.md.

  - name: Question or usage help
    url: https://github.com/reprodev/cvedeck/discussions
    about: >-
      For "how do I..." and "is this supposed to...", start a discussion. If it
      turns out to be a bug, we will open an issue from it.
