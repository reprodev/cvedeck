# Alembic configuration for the CveDeck.
#
# The database URL is NOT set here. It is resolved at runtime by
# app.config.database_url() inside migrations/env.py, so the migration story
# honours CVEDECK_DB_URL / CVEDECK_DATA_DIR exactly like the app does
# and there is only one place a deployment configures its database.

[alembic]
script_location = app/data/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
